<!DOCTYPE html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#050916"><title>WDEA DEX WORLD</title><style>
*{box-sizing:border-box}body{margin:0;background:#050916;color:white;font:14px system-ui;overflow:hidden;touch-action:none}canvas{display:block}#hud{position:absolute;top:env(safe-area-inset-top,10px);left:12px;right:12px;pointer-events:none}h1{font-size:17px;letter-spacing:3px;margin:10px 0 5px}#status{color:#7dfaff}#msg{position:absolute;top:22%;left:10%;width:80%;text-align:center;color:#d6faff;text-shadow:0 2px 10px black;pointer-events:none}#joy{position:absolute;bottom:calc(28px + env(safe-area-inset-bottom));left:24px;width:120px;height:120px;border:2px solid #54d9ff88;border-radius:50%;background:#1b365c55;touch-action:none}#knob{position:absolute;left:39px;top:39px;width:40px;height:40px;background:#59dfffaa;border-radius:50%;box-shadow:0 0 20px #0cf}#act{position:absolute;bottom:calc(53px + env(safe-area-inset-bottom));right:22px;width:86px;height:70px;border:1px solid #ff526d;border-radius:20px;background:#60192bcc;color:white;font-weight:bold}#hint{position:absolute;bottom:calc(8px + env(safe-area-inset-bottom));right:12px;color:#a6bed5;font-size:11px}#loading{position:absolute;inset:0;background:#050916;display:grid;place-items:center;text-align:center;z-index:9}#loading button{padding:14px 24px;border:1px solid #60ddff;background:#122b45;color:white;border-radius:12px;font-size:16px}#loading small{display:block;max-width:290px;color:#9aadc3;margin:15px auto}</style></head><body>
<div id="loading"><div><h1>WDEA DEX WORLD</h1><p>3D FUTURE CITY · V2</p><button id="start">BELÉPÉS A VÁROSBA</button><small>Internetkapcsolat szükséges a 3D motor első betöltéséhez. Bal joystick: mozgás · jobb oldali húzás: kamera.</small></div></div>
<div id="hud"><h1>DEX WORLD</h1><div id="status">KRISTÁLYOK: 0 / 10 · SZINT: 1</div></div><div id="msg">Üdvözöllek! Én vagyok DEX. Fedezzük fel az új várost!</div><div id="joy"><div id="knob"></div></div><button id="act">UGRÁS</button><div id="hint">JOBB OLDAL: KAMERA · BAL OLDAL: MOZGÁS</div>
<script type="module">
import * as THREE from 'https://esm.sh/three@0.180.0';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x050916);scene.fog=new THREE.FogExp2(0x07142a,.009);
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,250);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.setSize(innerWidth,innerHeight);document.body.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0x72baff,0x101024,2.1));const sun=new THREE.DirectionalLight(0x9bdfff,2.2);sun.position.set(20,45,10);scene.add(sun);
const mat=(color,emissive=0x000000,intensity=0)=>new THREE.MeshStandardMaterial({color,metalness:.45,roughness:.35,emissive,emissiveIntensity:intensity});
const ground=new THREE.Mesh(new THREE.PlaneGeometry(300,300),mat(0x0b1728));ground.rotation.x=-Math.PI/2;scene.add(ground);
const grid=new THREE.GridHelper(300,60,0x185878,0x14324a);grid.position.y=.02;scene.add(grid);
const road=mat(0x101e32),cyan=mat(0x1aaccf,0x00aaff,.6),pink=mat(0xff456b,0xff173b,.6);
function box(w,h,d,m,x,y,z){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);scene.add(o);return o}
box(12,.04,160,road,0,.05,0);box(160,.04,12,road,0,.055,0);
const windows=mat(0x8ceaff,0x00dfff,1.2),gold=mat(0xffc05c,0xff9d00,.9);
for(let x=-70;x<=70;x+=14)for(let z=-70;z<=70;z+=14){if(Math.abs(x)<12||Math.abs(z)<12)continue;const h=9+(Math.abs(x*7+z*13)%22);box(9,h,9,mat(0x13243a),x,h/2,z);box(9.4,.35,9.4,(x+z)%3?cyan:pink,x,h,z);for(let k=2;k<h-1;k+=3){box(9.15,.14,9.15,(k%2?cyan:pink),x,k,z);for(const q of [-2.8,0,2.8]){box(1.15,1.15,.08,windows,x+q,k+1.15,z+4.55);box(1.15,1.15,.08,windows,x+q,k+1.15,z-4.55)}}}
// Neon utak, parkok, kapuk, lebegő díszek
for(let q=-72;q<=72;q+=8){box(.16,.09,2.8,gold,-5.5,.12,q);box(.16,.09,2.8,gold,5.5,.12,q);box(2.8,.09,.16,cyan,q,.12,-5.5);box(2.8,.09,.16,cyan,q,.12,5.5)}
for(let i=0;i<18;i++){const x=(i%2?1:-1)*(11+(i%5)*14),z=-54+Math.floor(i/2)*12;const pole=box(.17,4,.17,mat(0x445c75),x,2,z);box(1,.25,1,cyan,x,4.1,z)}
for(const [x,z] of [[0,-35],[0,35],[-35,0],[35,0]]){box(1,9,1,cyan,x-5,4.5,z);box(1,9,1,cyan,x+5,4.5,z);box(11,.65,1,pink,x,9,z)}
for(let i=0;i<12;i++){const x=(i%2?1:-1)*(18+(i%4)*14),z=-40+Math.floor(i/2)*14;const tree=new THREE.Mesh(new THREE.ConeGeometry(2.1,5,6),mat(0x175c65,0x00d6bc,.25));tree.position.set(x,3,z);scene.add(tree);box(.4,1,.4,mat(0x51616d),x,.5,z)}
const player=new THREE.Group();scene.add(player);const body=new THREE.Mesh(new THREE.CapsuleGeometry(.45,1.1,5,10),mat(0xd8e6fa));body.position.y=1.15;player.add(body);const head=new THREE.Mesh(new THREE.SphereGeometry(.34,12,10),mat(0x13243a,0x0077ff,.5));head.position.y=2.15;player.add(head);
const dex=new THREE.Group();scene.add(dex);const orb=new THREE.Mesh(new THREE.SphereGeometry(.48,20,14),mat(0x9c122e,0xff173b,.8));dex.add(orb);const face=new THREE.Mesh(new THREE.BoxGeometry(.62,.22,.18),mat(0x050b14,0x111b35,.4));face.position.z=.42;dex.add(face);for(const x of [-.16,.16]){const eye=new THREE.Mesh(new THREE.BoxGeometry(.11,.07,.04),mat(0x79f9ff,0x00ffff,2));eye.position.set(x,0,.53);dex.add(eye)}const ring=new THREE.Mesh(new THREE.TorusGeometry(.67,.045,8,40),pink);ring.rotation.x=Math.PI/3;dex.add(ring);
const crystals=[];for(const [x,z] of [[8,8],[-15,12],[24,-18],[-28,-25],[38,35],[-42,32],[18,44],[55,-42],[-50,-52],[48,15]]){const c=new THREE.Mesh(new THREE.OctahedronGeometry(.7),mat(0x6fffea,0x00ffff,1.3));c.position.set(x,1.5,z);scene.add(c);crystals.push(c)}
let count=0,yaw=0,joyX=0,joyY=0,started=false,last=performance.now(),sayUntil=0,jump=0,vy=0;const msg=document.getElementById('msg'),status=document.getElementById('status');
function say(t){msg.textContent=t;sayUntil=performance.now()+3500}
document.getElementById('start').onclick=()=>{document.getElementById('loading').style.display='none';started=true};
document.getElementById('act').onclick=()=>{if(jump<=.001){vy=7.5;}};
const joy=document.getElementById('joy'),knob=document.getElementById('knob');let jid=null,camid=null,px=0;
joy.addEventListener('pointerdown',e=>{jid=e.pointerId;joy.setPointerCapture(jid);movejoy(e)});joy.addEventListener('pointermove',e=>{if(e.pointerId===jid)movejoy(e)});function movejoy(e){const r=joy.getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2,l=Math.max(1,Math.hypot(dx,dy)),f=Math.min(1,l/44);joyX=dx/l*f;joyY=dy/l*f;knob.style.transform=`translate(${joyX*39}px,${joyY*39}px)`}function stopjoy(e){if(e.pointerId===jid){jid=null;joyX=joyY=0;knob.style.transform=''}}joy.addEventListener('pointerup',stopjoy);joy.addEventListener('pointercancel',stopjoy);
renderer.domElement.addEventListener('pointerdown',e=>{if(e.clientX>innerWidth*.38){camid=e.pointerId;px=e.clientX;renderer.domElement.setPointerCapture(camid)}});renderer.domElement.addEventListener('pointermove',e=>{if(e.pointerId===camid){yaw-=(e.clientX-px)*.007;px=e.clientX}});renderer.domElement.addEventListener('pointerup',e=>{if(e.pointerId===camid)camid=null});
function tick(t){requestAnimationFrame(tick);const dt=Math.min(.05,(t-last)/1000);last=t;if(started){const vx=joyX*Math.cos(yaw)-joyY*Math.sin(yaw),vz=-joyX*Math.sin(yaw)-joyY*Math.cos(yaw);player.position.x+=vx*dt*9;player.position.z+=vz*dt*9;jump=Math.max(0,jump+vy*dt);vy-=19*dt;if(jump===0)vy=0;player.position.y=jump;if(Math.abs(vx)+Math.abs(vz)>.1)player.rotation.y=Math.atan2(vx,vz);dex.position.lerp(new THREE.Vector3(player.position.x+2,1.8+Math.sin(t*.003)*.25,player.position.z-1.5),Math.min(1,dt*3));ring.rotation.z+=dt;for(const c of crystals){if(!c.visible)continue;c.rotation.y+=dt*1.5;c.position.y=1.5+Math.sin(t*.002+c.position.x)*.2;if(c.position.distanceTo(new THREE.Vector3(player.position.x,1.5,player.position.z))<2){c.visible=false;count++;status.textContent=`KRISTÁLYOK: ${count} / 10 · SZINT: ${count===10?2:1}`;say(count===10?'DEX: Sikerült! Mind a tíz kristályt összegyűjtöttük!':`DEX: Szép munka! ${count}/10 kristály megvan.`)}}if(t>sayUntil&&sayUntil!==0){msg.textContent='';sayUntil=0}}const offset=new THREE.Vector3(Math.sin(yaw)*-9,6,Math.cos(yaw)*-9);camera.position.lerp(player.position.clone().add(offset),Math.min(1,dt*6));camera.lookAt(player.position.x,1.3,player.position.z);renderer.render(scene,camera)}requestAnimationFrame(tick);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
